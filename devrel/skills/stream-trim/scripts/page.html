<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stream-trim</title>
<style>
  :root { --bg: #14131f; --panel: #1f1d2e; --text: #e8e6f0; --muted: #9a97ad; --accent: #7c6cf0; --in: #3ccf8e; --out: #f0716c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px 20px 32px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; color: var(--muted); }
  video { width: 100%; max-height: calc(100vh - 290px); background: #000; border-radius: 6px; display: block; }
  #wave { width: 100%; height: 110px; display: block; margin-top: 10px; background: var(--panel); border-radius: 6px; cursor: pointer; touch-action: none; }
  .readout { display: flex; gap: 28px; margin: 12px 0; font: 600 17px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .readout .in { color: var(--in); } .readout .out { color: var(--out); }
  .readout span small { display: block; font: 12px -apple-system, system-ui, sans-serif; color: var(--muted); margin-bottom: 4px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .keys { color: var(--muted); font-size: 13px; }
  kbd { background: var(--panel); border: 1px solid #34314a; border-radius: 4px; padding: 1px 6px; font: 12px ui-monospace, Menlo, monospace; color: var(--text); }
  button { font: 600 15px -apple-system, system-ui, sans-serif; padding: 9px 22px; border-radius: 6px; border: 0; cursor: pointer; background: var(--accent); color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.secondary { background: #34314a; }
  #status { margin-top: 14px; min-height: 24px; }
  progress { width: 320px; height: 10px; vertical-align: middle; margin-right: 10px; accent-color: var(--accent); }
  .error { color: var(--out); white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .note { color: var(--muted); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header h1 { margin: 0; }
  .tabs button { background: transparent; color: var(--muted); padding: 6px 16px; }
  .tabs button.on { background: var(--panel); color: var(--text); }
  .card { background: var(--panel); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .card.off { opacity: 0.55; }
  .card .head { display: flex; gap: 10px; align-items: baseline; font-weight: 600; }
  .card .head input { transform: scale(1.3); }
  .card .times { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin: 10px 0; font: 600 14px ui-monospace, Menlo, monospace; }
  .card .times button { padding: 3px 9px; font-size: 12px; background: #34314a; }
  .card .body { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  .card img { width: 200px; aspect-ratio: 9 / 16; object-fit: cover; background: #000; border-radius: 6px; }
  .card pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); padding: 8px 10px; border-radius: 6px; max-height: 220px; overflow: auto; margin: 6px 0; }
  .card textarea { width: 100%; min-height: 48px; background: var(--bg); color: var(--text); border: 1px solid #34314a; border-radius: 6px; font: 13px ui-monospace, Menlo, monospace; padding: 6px 8px; }
  .card input[type=range] { width: 100%; }
  .card .warn { color: var(--out); }
  .card .state { margin-top: 8px; }
  #shorts-bar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; display: flex; gap: 16px; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="name">Loading...</h1>
    <div class="tabs"><button id="tab-trim" class="on">Trim</button><button id="tab-shorts" disabled>Shorts</button></div>
  </header>
  <section id="trim-view">
  <video id="video" src="/proxy.mp4" preload="auto"></video>
  <canvas id="wave"></canvas>
  <div class="row">
    <div class="readout">
      <span class="in"><small>In</small><b id="in-t">-</b></span>
      <span class="out"><small>Out</small><b id="out-t">-</b></span>
      <span><small>Length</small><b id="len-t">-</b></span>
      <span><small>Playhead</small><b id="now-t">-</b></span>
    </div>
    <div>
      <button id="stop" class="secondary" hidden>Stop</button>
      <button id="render">Render</button>
    </div>
  </div>
  <div class="keys">
    <kbd>Space</kbd> play/pause &nbsp; <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> back 5 s / pause / play (again for faster) &nbsp;
    <kbd>I</kbd> <kbd>O</kbd> set In / Out &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> 1 frame &nbsp; <kbd>Shift</kbd>+arrows 1 s &nbsp;
    <kbd>Q</kbd> <kbd>W</kbd> jump to In / Out &nbsp; drag the green and red markers
  </div>
  <div id="status"></div>
  </section>
  <section id="shorts-view" hidden>
    <div id="shorts-note" class="note"></div>
    <div id="cards"></div>
    <div id="shorts-bar"><button id="render-shorts" disabled>Render selected</button><span id="shorts-status" class="note"></span></div>
  </section>
</main>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('wave');
const ctx = canvas.getContext('2d');
const $ = (id) => document.getElementById(id);
let S = null;          // state from /api/state
let inT = 0, outT = 0; // seconds, video clock
let dragging = null;   // 'in' | 'out' | 'seek'
let polling = null;
let view = 'trim';

// Non-drop timecode from the frame count, like Premiere shows 23.976:
// 24 frames per timecode second.
function tc(t) {
  const base = Math.round(S.fps);
  const n = Math.max(0, frameAt(t + 1e-6));
  const ff = n % base, secs = Math.floor(n / base);
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(ff).padStart(2, '0')}`;
}

function snap(t) { return Math.min(S.duration, Math.max(0, Math.round(t * S.fps) / S.fps)); }
// The frame on screen: currentTime sits inside a frame, so floor, not round.
function frameAt(t) { return Math.floor(t * S.fps + 1e-6); }
// Seek a little into frame k, so float error never shows frame k - 1.
function seekFrame(k) { video.currentTime = Math.min(S.duration, Math.max(0, (k + 0.1) / S.fps)); }

function readout() {
  $('in-t').textContent = tc(inT);
  $('out-t').textContent = tc(outT);
  $('len-t').textContent = tc((Math.round(outT * S.fps) - Math.round(inT * S.fps)) / S.fps);
  $('now-t').textContent = tc(video.currentTime);
}

function x(t) { return t / S.duration * canvas.width; }

function draw() {
  if (!S) return;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== canvas.clientWidth * dpr) { canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr; }
  const W = canvas.width, H = canvas.height, mid = H / 2;
  ctx.clearRect(0, 0, W, H);
  const peaks = S.peaks, perPx = peaks.length / W;
  const top = S.peakMax || 1;
  ctx.fillStyle = '#7c6cf0';
  for (let px = 0; px < W; px++) {
    let p = 0;
    const a = Math.floor(px * perPx), b = Math.max(a + 1, Math.floor((px + 1) * perPx));
    for (let i = a; i < b && i < peaks.length; i++) p = Math.max(p, peaks[i]);
    const h = Math.max(1, Math.min(1, p / top) * (H - 8));
    ctx.fillRect(px, mid - h / 2, 1, h);
  }
  ctx.fillStyle = 'rgba(10, 9, 18, 0.7)';
  ctx.fillRect(0, 0, x(inT), H);
  ctx.fillRect(x(outT), 0, W - x(outT), H);
  for (const [t, color] of [[inT, '#3ccf8e'], [outT, '#f0716c']]) {
    ctx.fillStyle = color;
    ctx.fillRect(x(t) - 1.5 * dpr, 0, 3 * dpr, H);
  }
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x(video.currentTime) - 0.5 * dpr, 0, 1 * dpr, H);
}

function tick() { readout(); draw(); requestAnimationFrame(tick); }

function timeAt(e) {
  const r = canvas.getBoundingClientRect();
  return snap((e.clientX - r.left) / r.width * S.duration);
}

canvas.addEventListener('pointerdown', (e) => {
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, near = (t) => Math.abs(t / S.duration * r.width - px) < 8;
  dragging = near(inT) ? 'in' : near(outT) ? 'out' : 'seek';
  canvas.setPointerCapture(e.pointerId);
  move(e);
});
canvas.addEventListener('pointermove', (e) => { if (dragging) move(e); });
canvas.addEventListener('pointerup', () => { dragging = null; });

function move(e) {
  const t = timeAt(e);
  if (dragging === 'in') inT = Math.min(t, outT - 1 / S.fps);
  else if (dragging === 'out') outT = Math.max(t, inT + 1 / S.fps);
  else seekFrame(frameAt(t + 0.5 / S.fps));
  if (dragging !== 'seek') seekFrame(Math.round((dragging === 'in' ? inT : outT) * S.fps));
}

document.addEventListener('keydown', (e) => {
  if (!S || view !== 'trim' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea')) return;
  // A focused button would also take Space/Enter (a stray Render).
  if (e.target instanceof HTMLButtonElement) e.target.blur();
  const step = e.shiftKey ? Math.round(S.fps) : 1;
  const here = frameAt(video.currentTime);
  const k = e.key.toLowerCase();
  if (k === ' ') { video.paused ? video.play() : video.pause(); }
  else if (k === 'k') { video.pause(); video.playbackRate = 1; }
  else if (k === 'l') {
    if (!video.paused) video.playbackRate = Math.min(8, video.playbackRate * 2);
    else { video.playbackRate = 1; video.play(); }
  }
  else if (k === 'j') { video.currentTime = Math.max(0, video.currentTime - 5); }
  else if (k === 'i') { const t = here / S.fps; if (t < outT) inT = t; else flash('In has to be before Out'); }
  else if (k === 'o') { const t = here / S.fps; if (t > inT) outT = t; else flash('Out has to be after In'); }
  else if (k === 'arrowleft') { video.pause(); seekFrame(here - step); }
  else if (k === 'arrowright') { video.pause(); seekFrame(here + step); }
  else if (k === 'q') { seekFrame(Math.round(inT * S.fps)); }
  else if (k === 'w') { seekFrame(Math.round(outT * S.fps)); }
  else return;
  e.preventDefault();
});

function flash(text) { $('status').innerHTML = `<span class="note">${text}</span>`; }

function showRender(r) {
  const busy = r.state === 'running';
  $('render').disabled = busy || S.exists || r.state === 'done';
  $('stop').hidden = !busy;
  if (busy) {
    const label = r.phase === 'measuring' ? 'Measuring loudness' : 'Encoding 4K';
    $('status').innerHTML = `<progress max="100" value="${r.percent}"></progress>${label}: ${r.percent.toFixed(1)}%`;
  } else if (r.state === 'done') {
    const first = !S.exists || !S.edit;
    S.exists = true;
    $('status').innerHTML = `Done: <b>${escapeHtml(r.output)}</b><br><span class="note">Shorts from this edit are in the Shorts tab.</span>`;
    if (first) refreshEdit(true);
  } else if (r.state === 'error') {
    $('status').innerHTML = `<div class="error">${escapeHtml(r.error)}</div>`;
  } else if (S.exists) {
    $('status').innerHTML = `<span class="note">${escapeHtml(S.output.split('/').pop())} already exists</span>`;
  }
  if (busy && !polling) polling = setInterval(poll, 1000);
  if (!busy && polling) { clearInterval(polling); polling = null; }
}

async function poll() { showRender(await (await fetch('/api/render')).json()); }

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

$('render').addEventListener('click', async () => {
  $('render').blur();
  $('render').disabled = true;
  const res = await fetch('/api/render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ in: inT, out: outT }) });
  if (res.status !== 202) {
    const body = await res.json();
    $('status').innerHTML = `<div class="error">${escapeHtml(body.error)}</div>`;
    $('render').disabled = S.exists;
    return;
  }
  poll();
  if (!polling) polling = setInterval(poll, 1000);
});

$('stop').addEventListener('click', () => fetch('/api/stop', { method: 'POST' }));

(async () => {
  S = await (await fetch('/api/state')).json();
  const start = S.edit || S;
  inT = snap(start.in); outT = snap(start.out);
  if (S.edit) enableShorts();
  S.peakMax = Math.max(1e-4, ...S.peaks.filter((p) => p > 0).sort((a, b) => a - b).slice(-Math.max(1, Math.floor(S.peaks.length / 200))).slice(0, 1));
  $('name').textContent = S.name;
  video.addEventListener('loadedmetadata', () => seekFrame(Math.round(inT * S.fps)), { once: true });
  showRender(S.render);
  requestAnimationFrame(tick);
})();

// ---- Views ----

function showView(name) {
  view = name;
  $('trim-view').hidden = name !== 'trim';
  $('shorts-view').hidden = name !== 'shorts';
  $('tab-trim').classList.toggle('on', name === 'trim');
  $('tab-shorts').classList.toggle('on', name === 'shorts');
  if (name === 'shorts') { video.pause(); loadShorts(); }
}
$('tab-trim').addEventListener('click', (e) => { e.target.blur(); showView('trim'); });
$('tab-shorts').addEventListener('click', (e) => { e.target.blur(); showView('shorts'); });

function enableShorts() { $('tab-shorts').disabled = false; }

async function refreshEdit(switchView) {
  const st = await (await fetch('/api/state')).json();
  S.edit = st.edit;
  if (S.edit) { enableShorts(); if (switchView) showView('shorts'); }
}

// ---- Shorts ----

let SH = null;          // /api/shorts
const cards = {};       // n -> card state
let shortsTimer = null;
let queue = Promise.resolve();

function secs(t) {
  if (typeof t === 'number') return t;
  return String(t).split(':').reduce((a, p) => a * 60 + parseFloat(p), 0);
}
function editTc(t) { return tc(Math.max(0, t - SH.shift - SH.edit.in)); }
function insideEdit(c) {
  return c.start - 0.2 - SH.shift >= SH.edit.in && c.end + 0.4 - SH.shift <= SH.edit.out;
}

async function loadShorts() {
  try {
    SH = await (await fetch('/api/shorts')).json();
  } catch (err) {
    $('shorts-note').textContent = 'Lost the server: ' + err.message;
    return schedule(3000);
  }
  if (!SH.edit) {
    $('shorts-note').textContent = 'Render the final edit first. Shorts come from inside it.';
  } else if (!SH.candidates) {
    $('shorts-note').textContent = SH.error
      ? "Claude is still writing the shortlist (" + SH.error + ")."
      : "Claude is finding shorts in this edit. They'll show up here.";
  } else {
    $('shorts-note').textContent = SH.candidates.length + ' shorts from this edit. Tick the ones to render.';
    drawCards();
  }
  showShortsRender(SH.render);
  const waiting = !SH.candidates || SH.render.state === 'running';
  if (waiting && view === 'shorts') schedule(SH.render.state === 'running' ? 1000 : 3000);
}

function schedule(ms) { clearTimeout(shortsTimer); shortsTimer = setTimeout(loadShorts, ms); }

function layoutOf(c) { return SH.layouts[c.layout || SH.default_layout] || null; }

function drawCards() {
  const box = $('cards');
  for (const c of SH.candidates) {
    if (cards[c.n]) continue;
    const pan = layoutOf(c);
    const k = cards[c.n] = { c, start: secs(c.start), end: secs(c.end),
      pan_x: c.pan_x ?? (pan ? pan.x : null), panMoved: c.pan_x != null, accepted: {} };
    const off = c.skip ? 'Skipped: ' + c.skip : (!c.inside ? 'Runs outside the edit' : '');
    const el = k.el = document.createElement('div');
    el.className = 'card' + (off ? ' off' : '');
    const sugg = Object.entries(c.suggested_fixes || {});
    el.innerHTML = `
      <label class="head"><input type="checkbox" class="pick" ${off ? 'disabled' : ''}>
        <span>${String(c.n).padStart(2, '0')}</span><span>${escapeHtml(c.hook || c.file)}</span></label>
      ${off ? `<div class="note">${escapeHtml(off)}</div>` : ''}
      <div class="times">
        <span>Start <button data-k="start" data-d="-0.5">-0.5 s</button> <b class="st"></b> <button data-k="start" data-d="0.5">+0.5 s</button></span>
        <span>End <button data-k="end" data-d="-0.5">-0.5 s</button> <b class="en"></b> <button data-k="end" data-d="0.5">+0.5 s</button></span>
        <span>Length <b class="ln"></b></span>
        <span class="warn"></span>
      </div>
      <div class="body">
        <img class="pv" alt="">
        <div>
          ${pan ? `<label class="note">Screen crop <input type="range" class="pan" min="${pan.pan[0]}" max="${pan.pan[1]}" value="${k.pan_x}"></label>` : ''}
          <div class="note">Captions</div><pre class="cap">Loading...</pre>
          ${sugg.length ? '<div class="note">Suggested fixes</div>' + sugg.map(([h, m], i) =>
            `<label><input type="checkbox" class="sugg" data-i="${i}"> ${escapeHtml(h)} &rarr; ${escapeHtml(m)}</label><br>`).join('') : ''}
          <div class="note">More fixes, one per line: heard = meant</div>
          <textarea class="fixes"></textarea>
        </div>
      </div>
      <div class="state note"></div>`;
    box.appendChild(el);
    el.querySelectorAll('.times button').forEach((b) => b.addEventListener('click', () => {
      b.blur();
      k[b.dataset.k] = Math.round((k[b.dataset.k] + parseFloat(b.dataset.d)) * 100) / 100;
      drawTimes(k); refresh(c.n, true);
    }));
    const slider = el.querySelector('.pan');
    if (slider) slider.addEventListener('change', () => { k.pan_x = parseInt(slider.value, 10); k.panMoved = true; refresh(c.n, false); });
    el.querySelectorAll('.sugg').forEach((box) => box.addEventListener('change', () => {
      const [h, m] = sugg[box.dataset.i];
      if (box.checked) k.accepted[h] = m; else delete k.accepted[h];
      captions(c.n);
    }));
    let typing = null;
    el.querySelector('.fixes').addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(() => captions(c.n), 600); });
    el.querySelector('.pick').addEventListener('change', countPicks);
    drawTimes(k);
    refresh(c.n, true);
  }
}

function drawTimes(k) {
  k.el.querySelector('.st').textContent = editTc(k.start);
  k.el.querySelector('.en').textContent = editTc(k.end);
  k.el.querySelector('.ln').textContent = (k.end - k.start).toFixed(1) + ' s';
  const warn = k.end <= k.start ? 'Start has to be before end'
    : (!insideEdit(k) && k.c.inside ? 'Now runs outside the edit' : '');
  k.el.querySelector('.warn').textContent = warn;
}

function fixesOf(k) {
  const out = { ...k.accepted };
  for (const line of k.el.querySelector('.fixes').value.split('\n')) {
    const i = line.indexOf('=');
    if (i > 0 && line.slice(0, i).trim() && line.slice(i + 1).trim()) out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return out;
}

function body(k) { return { n: k.c.n, file: k.c.file, start: k.start, end: k.end, pan_x: k.panMoved ? k.pan_x : null, fixes: fixesOf(k) }; }

async function post(url, data) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  let json = {};
  try { json = await res.json(); } catch (e) { json = { error: 'bad reply from the server' }; }
  return [res.status, json];
}

// Previews run one at a time (each one seeks the 4K recording).
function refresh(n, withCaptions) {
  const k = cards[n];
  if (k.end <= k.start) return;
  queue = queue.then(async () => {
    const [code, r] = await post('/api/shorts/preview', body(k));
    if (code === 200) { k.el.querySelector('.pv').src = r.url; k.el.querySelector('.state').textContent = ''; }
    else k.el.querySelector('.state').textContent = r.error;
  }).catch(() => {});
  if (withCaptions) captions(n);
}

async function captions(n) {
  const k = cards[n];
  if (k.end <= k.start) return;
  const [code, r] = await post('/api/shorts/captions', body(k));
  k.el.querySelector('.cap').textContent = code === 200 ? r.text : r.error;
}

function picked() { return Object.values(cards).filter((k) => k.el.querySelector('.pick').checked); }

function countPicks() {
  const n = picked().length;
  $('render-shorts').textContent = n ? `Render selected (${n})` : 'Render selected';
  $('render-shorts').disabled = !n || (SH && SH.render.state === 'running');
}

function showShortsRender(r) {
  const running = r.state === 'running';
  const states = Object.entries(r.clips || {});
  for (const [n, st] of states) {
    const k = cards[n];
    if (!k) continue;
    const text = st.state === 'done' ? 'Rendered: ' + st.output.split('/').pop()
      : st.state === 'error' ? 'Failed: ' + st.error
      : st.state === 'rendering' ? 'Rendering...' : 'Queued';
    k.el.querySelector('.state').textContent = text;
  }
  const done = states.filter(([, st]) => st.state === 'done').length;
  $('shorts-status').textContent = !states.length ? ''
    : running ? `Rendering ${done + 1} of ${states.length}`
    : r.state === 'done' ? `Rendered ${done} shorts into the shorts folder. Claude writes the titles and descriptions next.`
    : `${states.length - done} of ${states.length} failed. See the cards above.`;
  countPicks();
}

$('render-shorts').addEventListener('click', async () => {
  $('render-shorts').blur();
  $('render-shorts').disabled = true;
  const [code, r] = await post('/api/shorts/render', { picks: picked().map(body) });
  if (code !== 202) { $('shorts-status').textContent = r.error; countPicks(); return; }
  loadShorts();
});
</script>
</body>
</html>
