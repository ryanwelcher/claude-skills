# Collects PR, Trac and dev-note status every morning with the repo's own token, so a scheduled
# Claude sweep can read notes/status-report.md instead of needing GitHub credentials of its own.
name: Status
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-status.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add notes/status.json notes/status-report.md
          git diff --cached --quiet || git commit -m "Status: $(date -u +%Y-%m-%d)"
          git push
